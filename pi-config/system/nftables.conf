#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept

        # Trust these sources before any conntrack-state checks, so
        # multicast/broadcast traffic (mDNS etc.), which conntrack often
        # marks 'invalid', isn't dropped before we even look at it.
        iifname "tailscale0" accept
        ip saddr 192.168.0.0/24 accept
        ip6 saddr fe80::/10 accept
        ip6 saddr 2406:b400:53::/48 accept

        ct state established,related accept
        ct state invalid drop

        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query, mld-listener-report, mld-listener-reduction, echo-request, echo-reply } accept
        icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request, echo-reply } accept


        # Caddy: deliberately public, fronts Jellyfin only
        tcp dport { 80, 443 } accept

        counter drop
    }
    chain forward {
        type filter hook forward priority 0; policy accept;
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}
