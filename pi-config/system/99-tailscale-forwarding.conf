# /etc/sysctl.d/99-tailscale-forwarding.conf
#
# IP forwarding, required for Tailscale subnet routing (this box advertises
# 192.168.0.0/24 to the tailnet - see the 2026-08-21 JOURNAL.md entry). Without
# this, `tailscale set --advertise-routes` accepts the flag but silently can't
# actually forward traffic for the advertised subnet.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
