# /etc/default/zramswap
#
# Compressed in-memory swap via zram-tools, replacing the default dphys-swapfile
# (a 512MB swapfile on the SD card at /var/swap). SD cards degrade under the random
# write pattern of swap and swap-under-flash-wear causes latency spikes; zram trades
# a bit of CPU for zstd (de)compression instead and keeps swap I/O entirely in RAM.
# See the 2026-08-21 JOURNAL.md entry.
ALGO=zstd
PERCENT=50
